name: CI - Lancelot Kernel (Eleven)
on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Python 2 for MediaTek DCT
        run: |
          sudo apt-get update
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/aafiqbinkhayer-Toshiro/kernel_xiaomi_mt6768_hackX
          kernel-branch: eleven
          config: lancelot_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          anykernel3: true
